<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ひとつ違いナンプレ</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main class="app">
      <h1>ひとつ違いナンプレ</h1>
      <p id="status" aria-live="polite">盤面を準備しています…</p>
      <div id="board" class="board" role="grid" aria-label="ナンプレ盤面"></div>
      <button id="new-game" type="button">新しい問題</button>
      <button id="hint" type="button">ヒント</button>
      <div class="controls" aria-label="数字入力">
        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>
        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
        <button type="button" data-value="6">6</button>
        <button type="button" data-value="7">7</button>
        <button type="button" data-value="8">8</button>
        <button type="button" data-value="9">9</button>
        <button type="button" data-value="0">消去</button>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
